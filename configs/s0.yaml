# S0: formal-language pre-pretraining, the first 5% of the run (plan section 9; DESIGN 1.3).
#
# 5-day run: 70M tokens (5% of 1.41B); built with 8.0e7 so a faster machine can take a bit more, smaller runs
# (3-day 50M, the S0 ablation) read a prefix with the same mix. Rows are 512 tokens; every source is ASCII
# with every symbol one Qwen3 token (bonsai.formal). Loss mask (`mask: true` -> shard_*.mask):
#   s0_text        full loss (k-Shuffle Dyck, k-Dyck, MP-STRUCT)
#   s0_derivation  loss only on the target step after `next:` (Cheng et al. format)
# S0 pools are read from line 0 every build (`use_cursors: false`); 1% of each source -> tok/val_s0.

shard_dir: s0
val_dir: val_s0
val_fraction: 0.01
total_tokens: 8.0e7
seq_len: 512
mask: true
use_cursors: false
seed: 7

sources:
  s0_shuffle_dyck: {pool: s0_shuffle_dyck, format: s0_text,       weight: 0.30, max_epochs: 2}
  s0_dyck:         {pool: s0_dyck,         format: s0_text,       weight: 0.10, max_epochs: 2}
  s0_mp_struct:    {pool: s0_mp_struct,    format: s0_text,       weight: 0.20, max_epochs: 2}
  s0_derivations:  {pool: s0_derivations,  format: s0_derivation, weight: 0.40, max_epochs: 2}
