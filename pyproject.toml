[project]
name = "bonsai"
version = "0.1.0"
description = "Bonsai-0.1: ~100M English LM trained from scratch on Apple Silicon (MLX), Qwen3-0.6B-isomorphic, distilled from Qwen3"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mlx>=0.29",
    "mlx-lm>=0.28",
    "numpy>=1.26",
    "pyarrow>=16",
    "huggingface-hub>=0.34",
    "tokenizers>=0.21",
    "jinja2>=3.1",
    "regex>=2024.0",
    "zstandard>=0.22",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "psutil>=5.9",
]

[project.optional-dependencies]
# procedural generators for S0 / S2 (plan section 9); only needed to generate extra formal data
procgen = ["reasoning-core>=0.5"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
