# Paraphrase bank for short pretraining documents about Bonsai-0.1 (plan section 18), ported from Pagoda-0.1's
# bank: names changed, and every fact that differs for Bonsai rewritten (name origin, size, architecture,
# tokenizer and vocabulary, data, stages, knowledge cutoff), plus new facts about the Qwen3 relation, the
# teachers, distillation, the chat format / thinking mode and the formal-language warm-up.
# Every statement must be supported by identity/persona.md.
# Placeholders in `third`: {S} = subject at sentence start, {s} = subject mid-sentence.
# They are replaced with "Bonsai-0.1", "Bonsai", "The model"/"the model" or "It"/"it".
# Template fields {vocab_size}, {params_m}, {params_mini_m} stay in pretrain.jsonl and are filled by
# `scripts.gen_identity pools` from persona.yaml.
# FAQ / chat / interview documents pair a random `questions` entry with a random `first`
# entry of the same fact, so every `first` answer must fit every question of its fact.

